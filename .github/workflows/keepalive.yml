name: Keep addon awake

# Render's free tier spins the service down after ~15 minutes without traffic.
# A ping every 10 minutes keeps it warm so Stremio requests never hit a cold
# start. Note: this uses most of Render's 750 free instance-hours per month —
# delete this workflow (or disable it in the Actions tab) if that is a problem.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 90 https://addon-dc-ila1.onrender.com/health
